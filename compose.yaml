services:
  api:
    build: .
    image: simweave:local
    command: ["simweave", "serve", "--host", "0.0.0.0"]
    environment:
      SIMWEAVE_TOKENS: ${SIMWEAVE_TOKENS:?Set SIMWEAVE_TOKENS to a JSON token-to-tenant mapping}
      SIMWEAVE_DB: /data/runs.sqlite3
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["simweave-data:/data"]
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  worker:
    image: simweave:local
    build: .
    command: ["simweave", "worker"]
    environment:
      SIMWEAVE_DB: /data/runs.sqlite3
    volumes: ["simweave-data:/data"]
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  simweave-data:
