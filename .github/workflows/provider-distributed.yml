name: Provider and distributed queue
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
        env:
          POSTGRES_PASSWORD: synthetic-postgres-only
          POSTGRES_DB: simweave_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SIMWEAVE_TEST_POSTGRES_DSN: postgresql://postgres:synthetic-postgres-only@127.0.0.1:5432/simweave_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --extra dev --extra postgres --extra s3
      - run: .venv/bin/python -m pytest tests/test_postgres.py tests/test_oidc.py
      - name: Start local Keycloak
        run: |
          docker run -d --name simweave-keycloak -p 127.0.0.1:19030:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=fixture-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=synthetic-admin-only \
            quay.io/keycloak/keycloak@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007 \
            start-dev --hostname http://127.0.0.1:19030
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19030/realms/master/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: .venv/bin/python scripts/check_keycloak.py --output .simweave/provider
      - run: docker build -f integrations/distributed/Dockerfile -t simweave-sw013-worker .
      - run: .venv/bin/python scripts/check_distributed.py --output .simweave/distributed
      - name: Stop provider fixture
        if: always()
        run: docker rm -f simweave-keycloak || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-distributed-verification
          path: |
            .simweave/provider/verification.json
            .simweave/distributed/verification.json
          include-hidden-files: true
          retention-days: 7
