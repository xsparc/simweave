name: Operator workflows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --extra dev --extra browser
      - run: uv run --frozen --extra dev --extra browser python -m playwright install --with-deps chromium
      - run: uv run --frozen --extra dev --extra browser python scripts/check_browser_workspace.py --output .simweave/browser
      - run: uv run --frozen --extra dev --extra browser python scripts/check_guided_review.py --output .simweave/guided-review
      - run: uv run --frozen --extra dev python scripts/check_operator_workers.py --output .simweave/workers
      - run: uv run --frozen --extra dev python scripts/check_operator_recovery.py --output .simweave/recovery --gib 0.01
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-${{ matrix.os }}
          path: |
            .simweave/browser/verification.json
            .simweave/guided-review/verification.json
            .simweave/guided-review/guided-review.png
            .simweave/browser/*-workspace.png
            .simweave/recovery/verification.json
            .simweave/workers/verification.json
          include-hidden-files: true
          retention-days: 7
