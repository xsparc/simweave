name: Statistical calibration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  calibration:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python -m pytest tests/test_calibration.py tests/test_decisions.py
      - name: Measure synthetic frequencies
        shell: bash
        run: |
          mkdir -p .simweave
          uv run --frozen --extra dev python -m simweave.cli calibrate --trials 1000 > .simweave/calibration.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calibration-${{ matrix.os }}
          path: .simweave/calibration.json
          include-hidden-files: true
          retention-days: 7
