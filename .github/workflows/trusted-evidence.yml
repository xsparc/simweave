name: Trusted evidence
on:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  signed-catalog:
    if: github.repository == 'xsparc/simweave'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.16
      - run: uv sync --frozen --extra dev
      - name: Generate synthetic catalog only
        run: uv run --frozen --extra dev python scripts/check_catalog_portability.py --output .simweave/catalog
      - name: Attest synthetic verification evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .simweave/catalog/catalog.ndjson
          create-storage-record: false
      - name: Retain signed bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p .simweave/proof
          cp -- "$BUNDLE_PATH" .simweave/proof/bundle.jsonl
      - name: Verify signature, restore and reject five negative controls
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          uv run --frozen --extra dev python scripts/check_attestation_ci.py
          --archive .simweave/catalog/catalog.ndjson --bundle .simweave/proof/bundle.jsonl
          --repository "$SOURCE_REPOSITORY" --ref "$SOURCE_REF" --commit "$SOURCE_COMMIT"
          --output .simweave/verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: signed-catalog-evidence
          path: |
            .simweave/catalog/catalog.ndjson
            .simweave/proof/bundle.jsonl
            .simweave/verified/policy.json
            .simweave/verified/verification.json
          include-hidden-files: true
          retention-days: 7
